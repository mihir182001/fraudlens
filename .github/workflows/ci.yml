name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

env:
  # Every mlflow.set_tracking_uri/log_metric call this project's own tests
  # and training scripts make triggers an outbound telemetry call MLflow
  # makes on its own. In this project's own development sandbox, that call
  # was blocked by an egress policy and its retries pushed a 286-test run
  # past a 2-minute timeout; confirmed directly by re-running the exact
  # same suite with this variable set and seeing it complete in under two
  # minutes instead of timing out. DO_NOT_TRACK=1 disables it; nothing
  # this project tests reads MLflow's own telemetry, so this has no effect
  # on what CI actually checks. This may well be unnecessary on GitHub's
  # own runners, which are not behind that same restrictive egress policy,
  # but it is harmless either way and cheap insurance against the same
  # class of flakiness.
  DO_NOT_TRACK: "1"

jobs:
  test:
    name: Run pytest suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run full test suite
        run: python -m pytest tests/ -v

  docker-build:
    name: Build Docker image and smoke-test the API container
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Train small serving artifacts for the smoke test
        # A freshly checked-out repo has no models/*.joblib (see
        # .gitignore and .dockerignore: trained artifacts are this
        # project's data, not code, and are never committed). The
        # container's own lifespan (src/api/main.py) refuses to start
        # without them, so this trains small, fast versions with the
        # exact same functions tests/test_api.py's own fixture uses,
        # purely so the smoke test below has something real to load.
        run: |
          python -c "
          import joblib
          from pathlib import Path
          from src.serving.train_serving_models import (
              train_fraud_serving_model,
              train_credit_serving_scorecard,
          )
          Path('models').mkdir(exist_ok=True)
          joblib.dump(train_fraud_serving_model(n_transactions=1200, seed=1), 'models/fraud_model.joblib')
          joblib.dump(train_credit_serving_scorecard(n_applications=1200, seed=1), 'models/credit_scorecard.joblib')
          "

      - name: Build the Docker image
        run: docker build -t fraudlens:ci .

      - name: Run the API container
        run: |
          touch audit_log.db
          docker run -d --name fraudlens_ci \
            -p 8000:8000 \
            -v "$PWD/models:/app/models:ro" \
            -v "$PWD/audit_log.db:/app/audit_log.db" \
            -e FRAUDLENS_MODELS_DIR=/app/models \
            -e FRAUDLENS_AUDIT_DB=/app/audit_log.db \
            fraudlens:ci

      - name: Wait for the API to report healthy
        run: |
          for i in $(seq 1 15); do
            if curl -sf http://localhost:8000/health; then
              echo ""
              echo "API is healthy."
              exit 0
            fi
            sleep 2
          done
          echo "API did not become healthy within 30 seconds."
          exit 1

      - name: Show container logs on failure
        if: failure()
        run: docker logs fraudlens_ci

      - name: Stop and remove the container
        if: always()
        run: docker rm -f fraudlens_ci || true
