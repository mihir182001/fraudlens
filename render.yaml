# render.yaml, Render Blueprint: deploys the FraudLens scoring API as a
# single free web service, built from this project's own Dockerfile.
#
# Only the API is deployed here, not the Streamlit dashboard. The
# dashboard reads the same mlflow.db/audit_log.db files the API writes to,
# which works locally because docker-compose.yml bind-mounts one shared
# host folder into both containers. Render gives each service its own,
# separate, non-shareable filesystem (confirmed directly from Render's own
# disk documentation: a persistent disk is accessible by only a single
# service, and disks are not available on the free plan at all), so a
# dashboard deployed as a second free service here would only ever show
# its own empty, disconnected data, never the real API's activity. See
# docs/deployment.md for the full reasoning and what this means in
# practice.
#
# No dockerCommand override here: the Dockerfile's own CMD already binds
# to ${PORT:-8000} using shell form, which Docker always runs through
# /bin/sh -c itself, so Render's injected $PORT env var expands reliably
# at container start. An earlier version of this file set
# `dockerCommand: sh -c "uvicorn ... --port $PORT"` to achieve the same
# thing, but Render's own parsing of that quoted string mangled it: the
# deploy failed with "sh: 1: uvicorn src.api.main:app --host 0.0.0.0
# --port 10000: not found" (dash's error format for its entire command
# line being treated as a single, unresolvable token — i.e. the quotes
# did not survive Render's handling of the field as expected). Letting
# the Dockerfile's own CMD do the $PORT expansion sidesteps that parsing
# path entirely.

services:
  - type: web
    name: fraudlens-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: ./
    plan: free
    healthCheckPath: /health
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"